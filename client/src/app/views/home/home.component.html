<div class="home" [@fadeSlideIn]>
  <header class="home__header">
    <h1>Create Your Quiz</h1>
    <p>Design a fully customizable quiz with themes, settings, and questions.</p>
  </header>
  <form [formGroup]="quizForm" class="home__form" (ngSubmit)="submitQuiz()">
    <!-- Metadata Section -->
    <section class="home__section">
      <h2>Quiz Metadata</h2>
      <div class="form-grid metadata-grid" formGroupName="meta">
        <label class="form-label title__input">
          <span>Quiz Title</span>
          <input type="text" formControlName="title" placeholder="Enter quiz title" />
          <div *ngIf="quizForm.get('meta.title')?.invalid && quizForm.get('meta.title')?.touched" class="error-message">
            Title is required and must be at least 3 characters.
          </div>
        </label>
        <label class="form-label desc__input">
          <span>Description</span>
          <textarea formControlName="description" placeholder="Enter a short description"></textarea>
        </label>
        <div formGroupName="theme" class="section-theme">
          <div class="theme-row">
            <label class="form-label">
              <span>Font</span>
              <input type="text" formControlName="font" placeholder="e.g., Poppins, sans-serif" />
            </label>
            <label class="color-picker small-color">
              <span>Primary Color</span>
              <input type="color" formControlName="primaryColor" />
            </label>
            <label class="color-picker small-color">
              <span>Secondary Color</span>
              <input type="color" formControlName="secondaryColor" />
            </label>
            <label class="color-picker small-color">
              <span>Background Color</span>
              <input type="color" formControlName="backgroundColor" />
            </label>
          </div>
        </div>
      </div>
    </section>

    <!-- Settings Section -->
    <section class="home__section">
      <h2>Quiz Settings</h2>
      <div class="form-grid settings-grid" formGroupName="settings">
        <label>
          <span>Time Limit (seconds)</span>
          <input type="number" formControlName="timeLimit" min="0" />
          <div *ngIf="quizForm.get('settings.timeLimit')?.invalid && quizForm.get('settings.timeLimit')?.touched" class="error-message">
            Time limit must be a non-negative number.
          </div>
        </label>
        <label>
          <span>Pass Percentage</span>
          <input type="number" formControlName="passPercentage" min="0" max="100" />
          <div *ngIf="quizForm.get('settings.passPercentage')?.invalid && quizForm.get('settings.passPercentage')?.touched" class="error-message">
            Pass percentage must be between 0 and 100.
          </div>
        </label>
        <label>
          <span>Max Attempts</span>
          <input type="number" formControlName="maxAttempts" min="1" />
          <div *ngIf="quizForm.get('settings.maxAttempts')?.invalid && quizForm.get('settings.maxAttempts')?.touched" class="error-message">
            Max attempts must be at least 1.
          </div>
        </label>

        <div class="settings-checkbox-row">
          <label class="small-checkbox">
            <input type="checkbox" formControlName="shuffleQuestions" />
            <span>Shuffle Questions</span>
          </label>
          <label class="small-checkbox">
            <input type="checkbox" formControlName="allowBackNavigation" />
            <span>Allow Back Navigation</span>
          </label>
          <label class="small-checkbox">
            <input type="checkbox" formControlName="showCorrectAnswers" />
            <span>Show Correct Answers</span>
          </label>
        </div>
        <div class="settings-checkbox-row">
          <label class="small-checkbox">
            <input type="checkbox" formControlName="enableLeaderboard" />
            <span>Enable Leaderboard</span>
          </label>
          <label class="small-checkbox">
            <input type="checkbox" formControlName="allowSkips" />
            <span>Allow Skips</span>
          </label>
          <label class="small-checkbox">
            <input type="checkbox" formControlName="questionTimer" />
            <span>Question Timer</span>
          </label>
        </div>
        <div class="settings-checkbox-row">
          <label class="small-checkbox">
            <input type="checkbox" formControlName="randomizeOptions" />
            <span>Randomize Options</span>
          </label>
          <label class="small-checkbox">
            <input type="checkbox" formControlName="showProgressBar" />
            <span>Show Progress Bar</span>
          </label>
          <!-- Placeholder for third item if needed -->
          <div class="placeholder"></div>
        </div>
      </div>
    </section>

    <!-- Questions Section -->
    <section class="home__section">
      <h2>Questions</h2>
      <div class="questions-list" formArrayName="questions">
        <div class="question-card" *ngFor="let question of questions.controls; let i = index" [formGroupName]="i">
          <div class="question-header">
            <h3>Question {{ i + 1 }}</h3>
            <button type="button" (click)="removeQuestion(i)">Remove</button>
          </div>
          <label>
            <span>Question Type</span>
            <select formControlName="type">
              <option value="multiple-choice">Multiple Choice</option>
              <option value="matching">Matching</option>
            </select>
          </label>
          <label class="full-width">
            <span>Prompt</span>
            <input type="text" formControlName="prompt" placeholder="Enter question prompt" />
            <div *ngIf="question.get('prompt')?.invalid && question.get('prompt')?.touched" class="error-message">
              Prompt is required and must be at least 3 characters.
            </div>
          </label>
          <label class="full-width">
            <span>Image URL (optional)</span>
            <input type="url" formControlName="image" placeholder="Enter image URL" />
          </label>
          <div formArrayName="answers" class="answers">
            <div *ngFor="let answer of question.get('answers').controls; let j = index" [formGroupName]="j">
              <div class="answer-label">
                <input type="text" formControlName="text" placeholder="Enter answer text" />
                <div *ngIf="answer.get('text')?.invalid && answer.get('text')?.touched" class="error-message">
                  Answer text is required.
                </div>
                <input type="checkbox" formControlName="isCorrect" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <button type="button" (click)="addQuestion()">Add Question</button>
    </section>

    <!-- Submit Button -->
    <footer class="home__footer">
      <button type="submit">Create Quiz</button>
    </footer>
  </form>
</div>
