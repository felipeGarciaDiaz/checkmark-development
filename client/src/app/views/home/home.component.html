<div class="home-container">

<section class="quiz-section create-quiz">
	<div class="section-content">
		<h2>Create a Quiz</h2>
		<p>Design your own fully customizable quiz. Add questions, set answers, and personalize your quiz experience.</p>
		<button class="primary-btn">Create Quiz</button>
	</div>
	<div class="section-image">
		<img src="assets/create-quiz.svg" alt="Create Quiz Illustration" />
	</div>
</section>

<section class="quiz-section join-quiz">
	<div class="section-content">
		<h2>Join a Quiz</h2>
		<p>Have a quiz code? Enter it below to join an existing quiz and compete with friends in real-time.</p>
		<form class="join-form">
			<input type="text" placeholder="Enter Quiz Code" class="quiz-code-input" />
			<button type="submit" class="secondary-btn">Join Quiz</button>
		</form>
	</div>
	<div class="section-image">
		<img src="assets/join-quiz.svg" alt="Join Quiz Illustration" />
	</div>
</section>
</div>
