<!-- client/src/app/components/quiz/quiz.component.html -->
<div *ngIf="config() as cfg" class="quiz-container">
  <div *ngIf="!finished(); else done">
    <div class="progress">Question {{ current() + 1 }} / {{ cfg.questions.length }}</div>
    <div class="quiz-card" [@fadeSlide]>
      <div *ngIf="showFeedback" class="feedback-bubble" [ngClass]="{correct: lastCorrect, wrong: !lastCorrect}">
        <ng-container *ngIf="lastCorrect; else wrongMsg">🎉 Correct!</ng-container>
        <ng-template #wrongMsg>😢 Wrong!</ng-template>
      </div>
      <h2 class="prompt">{{ cfg.questions[current()].prompt }}</h2>
      <img *ngIf="cfg.questions[current()].image" [src]="cfg.questions[current()].image" class="q-image" />
      <div class="answers">
        <button
          *ngFor="let ans of (cfg.questions[current()].answers | keyvalue)"
          class="answer-btn"
          [ngClass]="{
            correct: selected() === ans.key && ans.key === cfg.questions[current()].correct,
            wrong: selected() === ans.key && ans.key !== cfg.questions[current()].correct,
            disabled: selected() !== null
          }"
          (click)="choose(ans.key)"
          [disabled]="selected() !== null"
        >
          {{ ans.key }}: {{ ans.value }}
        </button>
      </div>
    </div>
  </div>
  <ng-template #done>
    <p>Loading results...</p>
  </ng-template>
</div>
